<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y Strategy OS | AI Creative Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --c-bg: #F0F0E4;
            --c-grid: #C8CAE0;
            --c-brand: #5357A0;
            --c-accent: #FED81F;
            --c-card-dark: #1A1D3A;
            --c-card-blue: #5357A0;
            --c-card-yellow: #FED81F;
            --c-card-light: #F4F4EC;

            --f-display: 'Syne', sans-serif;
            --f-accent: 'Cormorant Garamond', serif;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: var(--c-bg);
            color: var(--c-brand);
            font-family: var(--f-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        .bg-grid {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(var(--c-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--c-grid) 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: center center;
            filter: url(#warp-filter);
            opacity: 0.55;
            animation: breathe 20s ease-in-out infinite alternate;
        }
        @keyframes breathe {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.05) translate(-1%, -1%); }
        }

        nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .nav-item {
            position: absolute;
            font-family: var(--f-accent);
            font-style: italic;
            font-size: 1.5rem;
            color: var(--c-brand);
            pointer-events: auto;
            cursor: pointer;
            padding: 2rem;
            transition: opacity 0.3s ease;
            text-decoration: none;
        }
        .nav-item:hover {
            opacity: 0.6;
        }
        .nav-item.brand { top: 0; left: 0; font-style: normal; font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; letter-spacing: 0.02em; }
        .nav-item.about { bottom: 0; left: 0; }
        .nav-item.manifesto { bottom: 0; right: 0; }
        .nav-item.tools { top: 0; right: 0; }

        main {
            position: relative;
            z-index: 5;
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .center-cluster {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            transform: translateY(-2vh);
        }
        h1 {
            font-size: clamp(6rem, 12vw, 12rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 0.9;
            color: var(--c-brand);
            text-align: center;
            margin: 0;
        }
        .tagline {
            font-family: var(--f-accent);
            font-style: italic;
            font-size: 1.35rem;
            color: var(--c-brand);
            opacity: 0.7;
            margin-top: -0.25rem;
        }

        .scallop-btn {
            position: relative;
            background: transparent;
            color: var(--c-brand);
            font-family: var(--f-display);
            font-size: 1.1rem;
            font-weight: 400;
            padding: 1rem 2.5rem;
            cursor: pointer;
            border: none;
            outline: none;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            display: inline-block;
        }
        .scallop-svg-wrapper {
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            z-index: -1;
            pointer-events: none;
        }
        .scallop-btn span {
            position: relative;
            z-index: 2;
        }
        .scallop-btn:hover {
            transform: scale(1.05);
        }
        .scallop-btn:hover path {
            fill: var(--c-brand);
        }
        .scallop-btn:hover span {
            color: var(--c-bg);
        }

        .orbit-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            z-index: 2;
        }
        .tool-card {
            position: absolute;
            width: 160px;
            height: 100px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(26, 29, 58, 0.08);
            margin-top: -50px;
            margin-left: -80px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .tool-card:hover {
            z-index: 10;
        }

        .card-1 { transform: translate(0px, -320px) rotate(-10deg); background: var(--c-card-blue); animation: float 6s ease-in-out infinite alternate; }
        .card-2 { transform: translate(226px, -226px) rotate(15deg); background: var(--c-card-yellow); animation: float 7s ease-in-out infinite alternate-reverse; }
        .card-3 { transform: translate(320px, 0px) rotate(-5deg); background: var(--c-card-dark); animation: float 5s ease-in-out infinite alternate; }
        .card-4 { transform: translate(226px, 226px) rotate(20deg); background: var(--c-card-yellow); animation: float 8s ease-in-out infinite alternate-reverse; }
        .card-5 { transform: translate(0px, 320px) rotate(-15deg); background: var(--c-card-light); animation: float 6s ease-in-out infinite alternate; }
        .card-6 { transform: translate(-226px, 226px) rotate(10deg); background: var(--c-card-light); animation: float 7s ease-in-out infinite alternate-reverse; }
        .card-7 { transform: translate(-320px, 0px) rotate(-20deg); background: var(--c-card-blue); animation: float 5s ease-in-out infinite alternate; }
        .card-8 { transform: translate(-226px, -226px) rotate(5deg); background: var(--c-card-dark); animation: float 8s ease-in-out infinite alternate-reverse; }

        .tool-card:hover.card-1 { transform: translate(0px, -320px) rotate(0deg) scale(1.15); }
        .tool-card:hover.card-2 { transform: translate(226px, -226px) rotate(0deg) scale(1.15); }
        .tool-card:hover.card-3 { transform: translate(320px, 0px) rotate(0deg) scale(1.15); }
        .tool-card:hover.card-4 { transform: translate(226px, 226px) rotate(0deg) scale(1.15); }
        .tool-card:hover.card-5 { transform: translate(0px, 320px) rotate(0deg) scale(1.15); }
        .tool-card:hover.card-6 { transform: translate(-226px, 226px) rotate(0deg) scale(1.15); }
        .tool-card:hover.card-7 { transform: translate(-320px, 0px) rotate(0deg) scale(1.15); }
        .tool-card:hover.card-8 { transform: translate(-226px, -226px) rotate(0deg) scale(1.15); }

        @keyframes float {
            0% { margin-top: -50px; }
            100% { margin-top: -65px; }
        }

        .card-art { width: 100%; height: 100%; position: relative; }
        .card-art svg { width: 100%; height: 100%; }

        @media (max-width: 900px) {
            .orbit-container { transform: scale(0.7); }
            h1 { font-size: 5rem; }
        }
        @media (max-width: 600px) {
            .orbit-container { transform: scale(0.45); }
            h1 { font-size: 3.5rem; }
            .nav-item { font-size: 1.2rem; padding: 1.5rem; }
            .bg-grid { background-size: 40px 40px; }
        }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute; z-index:-1;">
        <defs>
            <filter id="warp-filter" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.003" numOctaves="2" result="noise"></feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="80" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
            </filter>
        </defs>
    </svg>

    <div class="bg-grid"></div>

    <nav>
        <div class="nav-item brand">Y Strategy OS</div>
        <a class="nav-item tools" href="app.html">Tools</a>
        <div class="nav-item about">About</div>
        <div class="nav-item manifesto">Imagine</div>
    </nav>

    <main>
        <div class="orbit-container">
            <!-- Card 1: Cover Studio -->
            <div class="tool-card card-1" title="Cover Studio">
                <div class="card-art">
                    <svg viewBox="0 0 160 100">
                        <rect width="160" height="100" fill="#5357A0"/>
                        <rect x="20" y="15" width="80" height="10" rx="2" fill="#FED81F"/>
                        <rect x="20" y="32" width="55" height="6" rx="2" fill="rgba(255,255,255,0.4)"/>
                        <rect x="20" y="44" width="65" height="6" rx="2" fill="rgba(255,255,255,0.25)"/>
                        <rect x="100" y="20" width="40" height="55" rx="4" fill="rgba(254,209,31,0.2)" stroke="#FED81F" stroke-width="1"/>
                        <circle cx="120" cy="47" r="12" fill="rgba(254,209,31,0.3)"/>
                        <path d="M115 47 L120 42 L125 47 L122 47 L122 52 L118 52 L118 47Z" fill="#FEFFEF"/>
                    </svg>
                </div>
            </div>
            <!-- Card 2: Strategy Engine -->
            <div class="tool-card card-2" title="Strategy Engine">
                <div class="card-art">
                    <svg viewBox="0 0 160 100">
                        <rect width="160" height="100" fill="#FED81F"/>
                        <circle cx="55" cy="50" r="25" fill="none" stroke="#5357A0" stroke-width="2.5"/>
                        <circle cx="55" cy="50" r="12" fill="#5357A0"/>
                        <line x1="80" y1="50" x2="140" y2="50" stroke="#5357A0" stroke-width="2" stroke-dasharray="4,4"/>
                        <circle cx="110" cy="35" r="8" fill="#1A1D3A"/>
                        <circle cx="130" cy="60" r="6" fill="#5357A0" opacity="0.5"/>
                        <path d="M50 50 L30 30 M50 50 L30 70 M60 50 L80 30" stroke="#1A1D3A" stroke-width="1.5"/>
                    </svg>
                </div>
            </div>
            <!-- Card 3: Data Vault -->
            <div class="tool-card card-3" title="Data Vault">
                <div class="card-art">
                    <svg viewBox="0 0 160 100">
                        <rect width="160" height="100" fill="#1A1D3A"/>
                        <ellipse cx="80" cy="30" rx="45" ry="12" fill="none" stroke="#5357A0" stroke-width="1.5"/>
                        <ellipse cx="80" cy="50" rx="45" ry="12" fill="none" stroke="#5357A0" stroke-width="1.5"/>
                        <ellipse cx="80" cy="70" rx="45" ry="12" fill="none" stroke="#FED81F" stroke-width="1.5"/>
                        <line x1="35" y1="30" x2="35" y2="70" stroke="#5357A0" stroke-width="1.5"/>
                        <line x1="125" y1="30" x2="125" y2="70" stroke="#5357A0" stroke-width="1.5"/>
                        <circle cx="80" cy="50" r="5" fill="#FED81F"/>
                    </svg>
                </div>
            </div>
            <!-- Card 4: Content Flow -->
            <div class="tool-card card-4" title="Content Flow">
                <div class="card-art">
                    <svg viewBox="0 0 160 100">
                        <rect width="160" height="100" fill="#FED81F"/>
                        <rect x="15" y="20" width="35" height="25" rx="4" fill="#5357A0"/>
                        <rect x="62" y="35" width="35" height="25" rx="4" fill="#1A1D3A"/>
                        <rect x="110" y="50" width="35" height="25" rx="4" fill="#5357A0"/>
                        <path d="M50 32 L62 47" stroke="#1A1D3A" stroke-width="2"/>
                        <path d="M97 47 L110 62" stroke="#1A1D3A" stroke-width="2"/>
                        <circle cx="56" cy="40" r="3" fill="#1A1D3A"/>
                        <circle cx="104" cy="55" r="3" fill="#1A1D3A"/>
                    </svg>
                </div>
            </div>
            <!-- Card 5: Analytics -->
            <div class="tool-card card-5" title="Analytics">
                <div class="card-art">
                    <svg viewBox="0 0 160 100">
                        <rect width="160" height="100" fill="#F4F4EC"/>
                        <line x1="20" y1="80" x2="140" y2="80" stroke="#C8CAE0" stroke-width="1"/>
                        <rect x="30" y="50" width="16" height="30" rx="2" fill="#5357A0"/>
                        <rect x="55" y="35" width="16" height="45" rx="2" fill="#FED81F"/>
                        <rect x="80" y="55" width="16" height="25" rx="2" fill="#5357A0" opacity="0.5"/>
                        <rect x="105" y="25" width="16" height="55" rx="2" fill="#FED81F"/>
                        <path d="M38 45 L63 30 L88 50 L113 20" fill="none" stroke="#1A1D3A" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="38" cy="45" r="3" fill="#1A1D3A"/>
                        <circle cx="63" cy="30" r="3" fill="#1A1D3A"/>
                        <circle cx="88" cy="50" r="3" fill="#1A1D3A"/>
                        <circle cx="113" cy="20" r="3" fill="#1A1D3A"/>
                    </svg>
                </div>
            </div>
            <!-- Card 6: Collaboration -->
            <div class="tool-card card-6" title="Collaboration">
                <div class="card-art">
                    <svg viewBox="0 0 160 100">
                        <rect width="160" height="100" fill="#F4F4EC"/>
                        <circle cx="55" cy="40" r="18" fill="#5357A0"/>
                        <circle cx="105" cy="40" r="18" fill="#FED81F"/>
                        <circle cx="80" cy="65" r="18" fill="#1A1D3A"/>
                        <circle cx="80" cy="40" r="8" fill="#FEFFEF" opacity="0.6"/>
                        <circle cx="68" cy="53" r="6" fill="rgba(254,254,239,0.4)"/>
                        <circle cx="92" cy="53" r="6" fill="rgba(254,254,239,0.4)"/>
                    </svg>
                </div>
            </div>
            <!-- Card 7: Brand Kit -->
            <div class="tool-card card-7" title="Brand Kit">
                <div class="card-art">
                    <svg viewBox="0 0 160 100">
                        <rect width="160" height="100" fill="#5357A0"/>
                        <rect x="20" y="20" width="50" height="60" rx="6" fill="#FEFFEF"/>
                        <rect x="28" y="28" width="34" height="8" rx="2" fill="#FED81F"/>
                        <rect x="28" y="42" width="20" height="4" rx="1" fill="#C8CAE0"/>
                        <rect x="28" y="50" width="28" height="4" rx="1" fill="#C8CAE0"/>
                        <rect x="28" y="58" width="16" height="4" rx="1" fill="#C8CAE0"/>
                        <circle cx="110" cy="35" r="15" fill="#FED81F"/>
                        <rect x="95" y="58" width="30" height="22" rx="4" fill="#1A1D3A"/>
                        <text x="110" y="73" fill="#FED81F" font-size="10" font-family="Syne" font-weight="700" text-anchor="middle">Aa</text>
                    </svg>
                </div>
            </div>
            <!-- Card 8: AI Vision -->
            <div class="tool-card card-8" title="AI Vision">
                <div class="card-art">
                    <svg viewBox="0 0 160 100">
                        <rect width="160" height="100" fill="#1A1D3A"/>
                        <path d="M30 50 Q80 15 130 50 Q80 85 30 50" fill="#5357A0"/>
                        <circle cx="80" cy="50" r="18" fill="#FEFFEF"/>
                        <circle cx="80" cy="50" r="8" fill="#FED81F"/>
                        <path d="M25 25 L32 28 M28 18 L25 28" stroke="#FED81F" stroke-width="1.5"/>
                        <path d="M135 75 L128 72 M132 82 L135 72" stroke="#FED81F" stroke-width="1.5"/>
                    </svg>
                </div>
            </div>
        </div>

        <div class="center-cluster">
            <h1>Imagine.</h1>
            <p class="tagline">where strategy meets creation</p>
            <a class="scallop-btn" href="app.html">
                <div class="scallop-svg-wrapper">
                    <svg width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 180 60">
                        <path d="
                            M 30 2
                            Q 40 5 50 2 Q 60 -1 70 2 Q 80 5 90 2 Q 100 -1 110 2 Q 120 5 130 2 Q 140 -1 150 2
                            A 28 28 0 0 1 178 30
                            A 28 28 0 0 1 150 58
                            Q 140 61 130 58 Q 120 55 110 58 Q 100 61 90 58 Q 80 55 70 58 Q 60 61 50 58 Q 40 55 30 58
                            A 28 28 0 0 1 2 30
                            A 28 28 0 0 1 30 2 Z"
                            fill="none" stroke="var(--c-brand)" stroke-width="1.5" stroke-linejoin="round"
                            style="transition: fill 0.3s ease;"/>
                    </svg>
                </div>
                <span>Start creating</span>
            </a>
        </div>
    </main>
</body>
</html>
